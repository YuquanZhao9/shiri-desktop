name: Desktop release (Windows + Mac)

# Builds the Windows portable EXE and the Apple Silicon Mac app from this
# repository's source and publishes both to a GitHub Release named after the
# package.json version. Nothing is published unless both builds succeed.
# Runs on pushes to the desktop-release branch, or manually once merged.
on:
  push:
    branches: [desktop-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run pack:win

      - name: Verify package and give it an ASCII file name
        run: |
          version=$(node -p "require('./package.json').version")
          exe=$(ls release/*-Windows.exe)
          node desktop/verify-package.cjs release/win-unpacked "$exe" > /dev/null
          mkdir -p out
          cp "$exe" "out/Yushi-$version-Windows-x64-portable.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: out/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  mac:
    name: Mac Apple Silicon
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          architecture: arm64
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --include=optional --no-audit --no-fund
      - run: npm run pack:mac

      - name: Check the app bundle and zip it
        run: |
          version=$(node -p "require('./package.json').version")
          app=$(ls -d release/mac-arm64/*.app)
          lipo -archs "$app/Contents/MacOS/"* | grep -q arm64
          codesign --verify --deep --strict "$app"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$app" "out/Yushi-$version-Mac-AppleSilicon.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          path: out/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out package.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Collect both packages
        run: |
          gh run download "$GITHUB_RUN_ID" --dir assets
          mkdir upload
          find assets -type f -exec mv {} upload/ \;
          (cd upload && sha256sum * > SHA256SUMS.txt)
          ls -l upload

      - name: Create or update the release
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          cat > notes.md <<NOTES
          昱时 $version 桌面版，由 GitHub Actions 从本仓库源码自动打包（提交 ${GITHUB_SHA::7}）。

          - Windows（x64 便携版，双击即用）：Yushi-$version-Windows-x64-portable.exe
          - Mac（Apple 芯片）：Yushi-$version-Mac-AppleSilicon.zip，解压后把「昱时」拖进「应用程序」。贴在桌面的常驻模式目前只有 Windows 版有。
          - iPhone：用 Safari 打开 https://yuquanzhao9.github.io/yushi-app/ ，再「添加到主屏幕」。

          两个安装包都没有付费开发者签名：Windows 出现蓝色提示时点「更多信息 → 仍要运行」；Mac 第一次打开被拦截时，到「系统设置 → 隐私与安全性」点「仍要打开」。

          这个版本不预置任何云端账号，数据默认只保存在本机；需要多端同步时，在「设置与同步」里填写自己的 Supabase 地址和密钥。文件校验值见 SHA256SUMS.txt。
          NOTES
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" upload/* --clobber
          else
            gh release create "$tag" upload/* --target "$GITHUB_SHA" --title "昱时 $version" --notes-file notes.md
          fi
