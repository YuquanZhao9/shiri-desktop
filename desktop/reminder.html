<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>昱时 · 提醒</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c3448; color: #eef6ff; font: 13px "Microsoft YaHei UI", "Segoe UI", sans-serif; user-select: none; }
  body { padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #d5e6f06b; }
  .item { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: #ffffff14; }
  .head { display: flex; align-items: center; gap: 8px; }
  .bell { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #ffb7a8; }
  .title { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { color: #cfdcea; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; justify-content: flex-end; gap: 6px; }
  button { border: 0; border-radius: 5px; padding: 5px 10px; font: inherit; font-size: 12px; color: #f0f6ff; background: #ffffff1e; cursor: pointer; }
  button:hover { background: #ffffff33; }
  button.primary { color: #182c41; background: #bed5ee; font-weight: 600; }
</style>
</head>
<body>
<script src="reminder.js"></script>
</body>
</html>
